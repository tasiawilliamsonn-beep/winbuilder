<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIN Builder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F7FB;--ink:#1B2B40;--soft:#51637A;--card:#FFFFFF;--line:#D5DFEA;--ind:#2A9D8F;--ind-bg:#E3F4F1;--sg:#5B5BD6;--sg-bg:#ECECFB;--ixl:#E0A31B;--ixl-bg:#FDF3DC;--good:#1F8A4C;--good-bg:#E2F5EA;--bad:#C23B4E;--bad-bg:#FBE6E9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121A26;--ink:#EEF3F9;--soft:#A9B7C8;--card:#1B2636;--line:#2E3D52;--ind-bg:#16332F;--sg-bg:#23244A;--ixl-bg:#3A2F14;--good-bg:#16331F;--bad-bg:#3A1A20}}
:root[data-theme="dark"]{--bg:#121A26;--ink:#EEF3F9;--soft:#A9B7C8;--card:#1B2636;--line:#2E3D52;--ind-bg:#16332F;--sg-bg:#23244A;--ixl-bg:#3A2F14;--good-bg:#16331F;--bad-bg:#3A1A20}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;font-size:1rem;line-height:1.5}
h1,h2,h3,h4{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;line-height:1.15}
.wrap{max-width:1080px;margin:0 auto;padding:0 1rem 4rem}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sg);outline-offset:2px}
header h1{font-size:clamp(1.8rem,4.5vw,2.4rem);margin:0}
header p{margin:.2rem 0 1rem;color:var(--soft)}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem}
.btn{border:0;border-radius:10px;padding:.55rem 1rem;background:var(--ink);color:var(--bg);font-family:"Fredoka",sans-serif;font-weight:600;display:inline-flex;align-items:center}
.btn.go{background:var(--ind);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.sm{padding:.3rem .7rem;font-size:.9rem}
.btn[hidden]{display:none}
.file input{display:none}
.msg{min-height:1.4em;font-weight:700;color:var(--good);margin:.25rem 0 .75rem}
.msg.err{color:var(--bad)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1.25rem}
.panel h2{margin:0 0 .25rem;font-size:1.35rem}
.panel .sub{color:var(--soft);margin:0 0 .75rem;font-size:.95rem}
.panel.ind{border-top:8px solid var(--ind)}.panel.sg{border-top:8px solid var(--sg)}.panel.ixl{border-top:8px solid var(--ixl)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem}
label.f{display:block;font-weight:700;font-size:.92rem}
label.f small{font-weight:400;color:var(--soft)}
input[type=text],input[type=number],textarea,select{width:100%;border:2px solid var(--line);border-radius:10px;padding:.45rem .6rem;background:var(--bg);margin-top:.2rem}
textarea{min-height:4.5rem}
.card{border:2px solid var(--line);border-radius:14px;padding:.8rem .9rem;margin-bottom:.8rem;background:var(--card)}
.card-h{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-bottom:.6rem}
.card-h b{font-family:"Fredoka",sans-serif;font-size:1.05rem;margin-right:auto}
.type{font-size:.8rem;font-weight:700;border-radius:999px;padding:.1rem .6rem;background:var(--ind-bg)}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:.5rem;align-items:end;margin-bottom:.4rem}
.row.opt{grid-template-columns:auto 1.4fr 1fr auto}
.row.opt input[type=radio]{width:22px;height:22px;accent-color:var(--good);margin-bottom:.6rem}
.adds{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.4rem}
.live{margin-top:.6rem;background:var(--ind-bg);border-radius:10px;padding:.5rem .75rem;font-size:.95rem}
.warn{color:var(--bad);font-weight:700}
.days{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.days button.d{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.4rem 1rem;font-family:"Fredoka",sans-serif;font-weight:600}
.days button.d[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.help{font-size:.9rem;color:var(--soft);background:var(--sg-bg);border-radius:10px;padding:.5rem .75rem;margin-bottom:.8rem}
.help code{font-size:.9rem;background:var(--card);border-radius:4px;padding:0 .25rem}
.note{color:var(--soft);font-size:.9rem}
.issues{background:var(--bad-bg);border-radius:12px;padding:.6rem 1rem;margin-bottom:1rem}
.issues ul{margin:.3rem 0 0;padding-left:1.2rem}
.modal{position:fixed;inset:0;background:rgba(10,20,35,.6);z-index:10;display:flex;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.modal[hidden]{display:none}
.modal-in{background:var(--card);margin:auto;width:min(1000px,96vw);height:92%;border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.modal-bar{display:flex;gap:1rem;align-items:center;padding:.6rem 1rem;border-bottom:2px solid var(--line)}
.modal-bar .note{margin-right:auto}
iframe{flex:1;border:0;width:100%;background:var(--bg)}
@media (max-width:640px){.row,.row.opt{grid-template-columns:1fr}.row.opt input[type=radio]{margin:0}}
.panel.gen{border-top:8px solid var(--sg)}
.panel.gen summary{cursor:pointer}
.stdlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.35rem;max-height:340px;overflow:auto;border:2px solid var(--line);border-radius:12px;padding:.6rem}
label.std{display:flex;gap:.45rem;align-items:flex-start;font-size:.92rem;padding:.25rem .3rem;border-radius:8px}
label.std:hover{background:var(--bg)}
label.std input{margin-top:.25rem;width:18px;height:18px;flex:none}
.ess{display:inline-block;background:var(--ixl);color:#1B2B40;border-radius:6px;padding:0 .35rem;font-size:.75rem;font-weight:700}
label.chk{display:inline-flex;gap:.35rem;align-items:center;border:2px solid var(--line);border-radius:999px;padding:.25rem .7rem}
input,select,textarea{box-sizing:border-box;max-width:100%}
.grid>*,label.f{min-width:0}
/* ---- shared site header (same on every teacher page) ---- */
.site{background:var(--card);border-bottom:2px solid var(--line)}
.site-in{max-width:1080px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.brand{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:1.2rem;text-decoration:none;color:var(--ink);display:inline-flex;gap:.4rem;align-items:center}
.site nav{display:flex;gap:.25rem;margin-left:auto;flex-wrap:wrap}
.site nav a{color:var(--soft);text-decoration:none;font-weight:700;padding:.4rem .85rem;border-radius:999px}
.site nav a:hover{background:var(--bg);color:var(--ink)}
.site nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.pagehead{margin:1.25rem 0 1rem}
.pagehead h1{font-size:clamp(1.7rem,4.5vw,2.3rem);margin:0}
.pagehead p{margin:.25rem 0 0;color:var(--soft);max-width:65ch}
@media print{.site{display:none}}
/* ---- builder steps ---- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:0 0 1rem;counter-reset:st}
.steps button{display:flex;gap:.6rem;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.6rem .8rem;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.02rem}
.steps button b{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bg);border:2px solid var(--line);font-size:.95rem}
.steps button small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;color:var(--soft);font-size:.82rem}
.steps button[aria-current="step"]{border-color:var(--sg);background:var(--sg-bg)}
.steps button[aria-current="step"] b{background:var(--sg);border-color:var(--sg);color:#fff}
.unitbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.5rem .8rem;margin-bottom:.5rem}
.unitbar .t{margin-right:auto;min-width:0}
.unitbar .t b{font-family:"Fredoka",sans-serif;font-size:1.05rem}
.chip{display:inline-block;border-radius:999px;padding:.05rem .6rem;font-size:.8rem;font-weight:700;background:var(--bg);border:1px solid var(--line);margin-left:.25rem}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:.5rem 1.1rem;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.02rem}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pickrow{display:flex;flex-wrap:wrap;gap:1rem 1.5rem;align-items:flex-end;margin:.25rem 0 1rem}
.pickrow>div>span{display:block;font-weight:700;font-size:.92rem;margin-bottom:.25rem}
.dom{border:2px solid var(--line);border-radius:12px;padding:.4rem .6rem .5rem;margin:0 0 .6rem}
.dom legend{font-family:"Fredoka",sans-serif;font-weight:600;padding:0 .35rem}
.dom legend button{margin-left:.4rem;font-size:.8rem;border:0;background:none;color:var(--sg);font-weight:700;text-decoration:underline;padding:0}
.domlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.1rem .5rem}
.stdwrap{max-height:none}
.count{font-weight:700;color:var(--sg)}
.big{font-size:1.1rem;padding:.7rem 1.4rem}
.nextbar{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center;margin-top:1rem}
.review{background:var(--ixl-bg);border-radius:10px;padding:.5rem .75rem;font-size:.9rem;margin:0 0 .75rem}
.ok{background:var(--good-bg);border-radius:12px;padding:.6rem 1rem;font-weight:700}
.steplist{counter-reset:s;list-style:none;padding:0;margin:.5rem 0 0}
.steplist li{counter-increment:s;position:relative;padding:.1rem 0 .6rem 2.4rem}
.steplist li::before{content:counter(s);position:absolute;left:0;top:0;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--ind);color:#fff;display:grid;place-items:center;font-weight:700;font-family:"Fredoka",sans-serif}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
details.panel>summary{cursor:pointer;list-style:none}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary h2{display:inline}
details.panel>summary::after{content:"Show";float:right;font-weight:700;color:var(--sg);font-size:.9rem}
details.panel[open]>summary::after{content:"Hide"}
.hide{display:none!important}
@media (max-width:640px){.steps{grid-template-columns:1fr}.steps button small{display:none}}
</style>
</head>
<body>
<header class="site"><div class="site-in">
  <a class="brand" href="index.html"><span aria-hidden="true">🧭</span> WIN Portal</a>
  <nav aria-label="Main"><a href="index.html">Home</a><a href="builder.html" aria-current="page">Build</a><a href="dashboard.html">Dashboard</a></nav>
</div></header>
<div class="wrap">
  <div class="pagehead"><h1>WIN Builder</h1><p>Pick the Indiana standards students need, check the unit, then share it with students in Canvas.</p></div>
  <nav class="steps" id="steps" aria-label="Builder steps"></nav>
  <div id="unitbar"></div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div id="app"></div>
  <input type="file" id="openUnit" accept=".json" hidden>
</div>
<div class="modal" id="modal" hidden>
  <div class="modal-in">
    <div class="modal-bar"><b id="mTitle">Student preview</b><span class="note" id="mNote">Answers you type here are practice only.</span><button class="btn go" data-act="printPacket" id="mPrint" hidden>Print or save as PDF</button><button class="btn ghost" data-act="closePreview">Close</button></div>
    <iframe id="pv" title="Student portal preview"></iframe>
  </div>
</div>

<script type="text/plain" id="tpl"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F7FB; --ink:#1B2B40; --soft:#51637A; --card:#FFFFFF; --line:#D5DFEA;
  --ind:#2A9D8F; --ind-bg:#E3F4F1;
  --sg:#5B5BD6;  --sg-bg:#ECECFB;
  --ixl:#E0A31B; --ixl-bg:#FDF3DC;
  --good:#1F8A4C; --good-bg:#E2F5EA; --bad:#C23B4E; --bad-bg:#FBE6E9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A26; --ink:#EEF3F9; --soft:#A9B7C8; --card:#1B2636; --line:#2E3D52;
    --ind-bg:#16332F; --sg-bg:#23244A; --ixl-bg:#3A2F14; --good-bg:#16331F; --bad-bg:#3A1A20;
  }
}
:root[data-theme="dark"]{
  --bg:#121A26; --ink:#EEF3F9; --soft:#A9B7C8; --card:#1B2636; --line:#2E3D52;
  --ind-bg:#16332F; --sg-bg:#23244A; --ixl-bg:#3A2F14; --good-bg:#16331F; --bad-bg:#3A1A20;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;font-size:1.125rem;line-height:1.55}
h1,h2,h3,.fred{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;line-height:1.15}
.wrap{max-width:960px;margin:0 auto;padding:1.25rem 1rem 3rem}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sg);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}
header.top h1{font-size:clamp(1.9rem,5vw,2.6rem);margin:0}
header.top p{margin:.25rem 0 0;color:var(--soft)}
.namebox label{display:block;font-size:.9rem;color:var(--soft)}
.namebox input{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:.45rem .7rem;width:14rem;max-width:100%}

.days{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.days button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem 1.1rem;font-family:"Fredoka",sans-serif;font-weight:600}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* route: the signature element */
.route{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.75rem}
.route::before{content:"";position:absolute;top:44px;left:16%;right:16%;height:8px;border-radius:8px;
  background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 28px);z-index:0}
.stop{position:relative;z-index:1;background:none;border:0;padding:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.stop .dot{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;border:6px solid var(--c);background:var(--card);transition:transform .15s}
.stop:hover .dot{transform:scale(1.05)}
.stop[aria-current="true"] .dot{background:var(--c);box-shadow:0 0 0 6px var(--cb)}
.stop .nm{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem}
.stop .st{font-size:.9rem;color:var(--soft)}
.stop .st.done{color:var(--good);font-weight:700}
.stop.ind{--c:var(--ind);--cb:var(--ind-bg)} .stop.sg{--c:var(--sg);--cb:var(--sg-bg)} .stop.ixl{--c:var(--ixl);--cb:var(--ixl-bg)}

.room{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:1.25rem;border-top:10px solid var(--c)}
.room.ind{--c:var(--ind);--cb:var(--ind-bg)} .room.sg{--c:var(--sg);--cb:var(--sg-bg)} .room.ixl{--c:var(--ixl);--cb:var(--ixl-bg)}
.room h2{margin:0 0 .25rem;font-size:1.7rem}
.room .goal{background:var(--cb);border-radius:12px;padding:.7rem 1rem;margin:.75rem 0 1.25rem}
.room .goal b{font-family:"Fredoka",sans-serif}
.empty{text-align:center;color:var(--soft);padding:2rem 1rem;border:2px dashed var(--line);border-radius:18px}

/* worksheet */
.score{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;font-weight:700}
.bar{flex:1;height:14px;background:var(--line);border-radius:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ind);width:0;transition:width .3s}
.q{border:2px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1rem}
.q.right{border-color:var(--good);background:var(--good-bg)}
.q .num{font-family:"Fredoka",sans-serif;font-weight:700;color:var(--ind)}
.q .prompt{font-size:1.2rem;margin:.25rem 0 .75rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.5rem}
.opts button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.7rem;font-size:1.15rem;min-height:52px}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.opts button.correct{border-color:var(--good);background:var(--good-bg);font-weight:700}
.fb{margin-top:.6rem;font-size:1rem;min-height:1.2em}
.fb.no{color:var(--bad)} .fb.yes{color:var(--good);font-weight:700}
.hintbtn{background:none;border:0;color:var(--soft);text-decoration:underline;padding:0;margin-top:.4rem;font-size:.95rem}
.hint{font-size:1rem;color:var(--soft);margin-top:.3rem}

/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .12em;font-size:.9em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 .15em .08em}
.fr span:last-child{padding:.08em .15em 0}

/* small group */
.cue{display:flex;gap:.6rem;align-items:center;background:var(--sg);color:#fff;border-radius:12px;padding:.6rem .9rem;margin-bottom:1rem;font-family:"Fredoka",sans-serif;font-weight:600}
.step{border-left:6px solid var(--sg);padding:.25rem 0 .25rem 1rem;margin-bottom:1.5rem}
.step h3{margin:0 0 .4rem;font-size:1.3rem}
.step .tag{display:inline-block;font-size:.85rem;background:var(--sg-bg);color:var(--ink);border-radius:999px;padding:.1rem .6rem;margin-bottom:.4rem;font-weight:700}
.blank{border:0;border-bottom:3px solid var(--sg);background:var(--sg-bg);width:7.5rem;padding:.1rem .3rem;border-radius:6px 6px 0 0;text-align:center}
.blank.ok{border-color:var(--good);background:var(--good-bg)}
.blank.miss{border-color:var(--bad);background:var(--bad-bg)}
.reveal{border:2px solid var(--sg);background:var(--card);border-radius:10px;padding:.35rem .9rem;font-size:1rem;margin-top:.5rem}
.hidden-ans{display:none;margin-top:.5rem;background:var(--sg-bg);border-radius:10px;padding:.6rem .9rem}
.hidden-ans.show{display:block}
.stepper{display:flex;justify-content:space-between;gap:1rem;margin-top:1rem}
.btn{border:0;border-radius:12px;padding:.7rem 1.2rem;background:var(--c);color:#fff;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:.35rem;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--sg)}
textarea{width:100%;min-height:4.5rem;border:2px solid var(--line);border-radius:10px;padding:.6rem;background:var(--card)}

/* ixl */
.std{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.std span{border:2px solid var(--ixl);border-radius:10px;padding:.3rem .7rem;font-size:.95rem}
.skill{display:flex;gap:.9rem;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:.8rem 1rem;margin-bottom:.6rem}
.skill input{width:26px;height:26px;margin-top:.15rem;accent-color:var(--good);flex:none}
.skill .t{font-weight:700}
.skill .d{font-size:.95rem;color:var(--soft)}

/* interactive work */

svg.nl{width:100%;max-width:520px;height:auto;display:block;overflow:visible}
.nl .axis{stroke:var(--ink);stroke-width:3;stroke-linecap:round}

.eq{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:1.4rem;font-family:"Fredoka",sans-serif}
.eq input{width:6.5rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .5rem;text-align:center;background:var(--card);font-family:"Atkinson Hyperlegible",sans-serif}

.small{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:.35rem .85rem;font-size:1rem}
.small.go{background:var(--ind);border-color:var(--ind);color:#fff;font-weight:700}
.work{margin-top:.9rem;background:var(--card);border:2px solid var(--good);border-radius:12px;padding:.55rem .85rem;font-size:1.02rem}
.pad{margin-top:.8rem}
.pad canvas{width:100%;height:220px;border:2px dashed var(--line);border-radius:12px;background:var(--card);touch-action:none;display:block;margin-top:.5rem}
.padbar{display:flex;gap:.5rem;margin-top:.4rem;align-items:center;font-size:.9rem;color:var(--soft)}
.ropts{display:flex;flex-wrap:wrap;gap:.5rem}
.ropts button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.6rem .9rem;font-size:1.05rem}
.ropts button.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}

.turnbar{display:flex;justify-content:center;margin:-.5rem 0 1.5rem}
.turnbtn{border:3px solid var(--ink);background:var(--card);border-radius:999px;padding:.6rem 1.4rem;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.1rem}
.turnbtn[aria-current="true"]{background:var(--ink);color:var(--bg)}
.room.turn{--c:var(--ink);--cb:var(--line)}
.checklist{list-style:none;padding:0;margin:0 0 1rem}
.checklist li{padding:.35rem 0;border-bottom:1px solid var(--line)}
.conf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.5rem;margin:.5rem 0 1rem}
.conf button,.chips button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.6rem;font-size:1rem}
.conf button span{display:block;font-size:1.8rem}
.conf button[aria-pressed="true"],.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0 1rem}
.chips button{border-radius:999px;padding:.4rem .9rem}
.turn h3{font-size:1.2rem;margin:1rem 0 .2rem}
.ws{background:var(--sg-bg);border-radius:10px;padding:.5rem .8rem}

/* passage + highlighter */
.passage{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin:0 0 1.25rem}

.pnum{display:inline-grid;place-items:center;min-width:1.6rem;height:1.6rem;border-radius:50%;background:var(--line);font-size:.8rem;font-weight:700;margin-right:.4rem;vertical-align:middle}
.sn{cursor:pointer;border-radius:4px;padding:.05rem 0;transition:background .15s}
.sn:hover{text-decoration:underline dotted}
.h-y{background:#FFE066;color:#1B2B40}.h-b{background:#A5D8FF;color:#1B2B40}.h-p{background:#FFC9DE;color:#1B2B40}
.hlbar{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.hc{border:2px solid var(--line);border-radius:999px;padding:.3rem .8rem;font-size:.95rem;background:var(--card)}
.hc-y{background:#FFE066;color:#1B2B40}.hc-b{background:#A5D8FF;color:#1B2B40}.hc-p{background:#FFC9DE;color:#1B2B40}
.hc[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.evopts{display:grid;gap:.5rem}
.evopts button.quote{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.7rem .9rem;font-size:1.05rem;font-style:italic}
.evopts button.wrong{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}

/* RACE room */
.room.race{--c:#D1495B;--cb:#FBE3E7}
.stop.race{--c:#D1495B;--cb:#FBE3E7}
.room.race .rletter{background:#D1495B;color:#fff}
.evbank{background:var(--bg);border-radius:12px;padding:.6rem .9rem;margin-bottom:1rem}
.evbank h3{margin:0 0 .4rem;font-size:1.1rem}
.evi{display:flex;gap:.6rem;align-items:flex-start;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--line)}
.evi span{font-style:italic;background:#FFE066;color:#1B2B40;border-radius:4px;padding:0 .2rem}
.starters{display:flex;flex-wrap:wrap;gap:.35rem;margin:.1rem 0 .35rem}
.starters button{border:1px dashed var(--soft);background:var(--card);border-radius:999px;padding:.15rem .6rem;font-size:.85rem}
.rcheck{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.7rem 1rem;margin-top:.5rem}
.rcheck div{padding:.15rem 0}.rcheck .ok{color:var(--good);font-weight:700}
/* math tools */
.toolsbtn{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:999px;padding:.75rem 1.1rem;background:var(--ink);color:var(--bg);font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:3px solid var(--ink);border-radius:18px 18px 0 0;max-height:70vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 24px rgba(0,0,0,.2)}
.sheet[hidden]{display:none}
.sheet-bar{display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.6rem .8rem;border-bottom:2px solid var(--line)}
.tabs{display:flex;gap:.35rem;overflow-x:auto}
.tabs button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .8rem;white-space:nowrap;font-size:.95rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet-body{overflow:auto;padding:.8rem 1rem}
.calc{max-width:320px;margin:0 auto}
.calc input{width:100%;font-size:1.6rem;text-align:right;padding:.5rem;border:2px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:.5rem}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.keys button{padding:.8rem 0;font-size:1.25rem;border:2px solid var(--line);border-radius:10px;background:var(--card)}
table.mult{border-collapse:collapse;margin:0 auto;font-size:.9rem}
table.mult th,table.mult td{border:1px solid var(--line);width:2.2rem;height:2rem;text-align:center;padding:0}
table.mult th{background:var(--bg)}table.mult td.line{background:var(--sg-bg)}table.mult td.hit{background:var(--sg);color:#fff;font-weight:700}
.fbars{display:grid;gap:.35rem;max-width:640px}
.fbar{display:flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.fbar span{flex:1;text-align:center;border-right:1px solid var(--ink);padding:.35rem 0;font-size:.8rem;cursor:pointer;background:var(--card)}
.fbar span:last-child{border-right:0}.fbar span.on{background:var(--ind);color:#fff}
.nlset{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end;margin-bottom:.5rem}
.nlset input{width:5rem;border:2px solid var(--line);border-radius:8px;padding:.3rem;background:var(--bg)}
svg.nltool{width:100%;max-width:700px;display:block;color:var(--ink);cursor:crosshair}
dl.forms{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;margin:0}
dl.forms dt{font-weight:700}dl.forms dd{margin:0}
.opts.long{grid-template-columns:1fr}
.opts.long button{text-align:left;padding:.7rem .9rem}
.tsteps{margin:.25rem 0 .75rem;padding-left:1.4rem}.tsteps li{margin:.2rem 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1 id="hTitle">WIN</h1><p id="hSub"></p></div>
    <div class="namebox"><label for="stuName">My name</label><input id="stuName" autocomplete="off" placeholder="First and last name"></div>
  </header>
  <nav class="days" id="days" aria-label="Choose a day"></nav>
  <div class="route" id="route"></div>
  <div id="turnbar"></div>
  <main id="room"></main>
</div>
<script>
const C = /*__CONFIG__*/null;
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F = (n,d,w) => (w?w+' ':'') + `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const fr = t => esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(\d+) (\d+)\/(\d+)|(\d+)\/(\d+)/g,(m,w,n,d,n2,d2)=>w?F(n,d,w):F(n2,d2));
const store = {
  get(k,def){try{const v=localStorage.getItem(`win:${C.id}:`+k);return v===null?def:JSON.parse(v)}catch(e){return def}},
  set(k,v){try{localStorage.setItem(`win:${C.id}:`+k,JSON.stringify(v))}catch(e){}}
};
function fmt(v){
  if(v==null||isNaN(v))return "?";
  const neg=v<0;v=Math.abs(v);const w=Math.floor(v+1e-9),f=v-w;
  if(f<1e-6)return (neg?"-":"")+w;
  if(Math.abs(f-.5)<1e-6)return (neg?"-":"")+(w?w:"")+"½";
  for(let d=2;d<=12;d++){const n=Math.round(f*d);if(Math.abs(n/d-f)<1e-6)return (neg?"-":"")+(w?w+" ":"")+n+"/"+d}
  return (neg?"-":"")+(+v.toFixed(2));
}
function parseNum(s){
  s=String(s).replace(/½/g," 1/2").replace(/¼/g," 1/4").replace(/¾/g," 3/4").replace(/,/g,"").replace(/\s+/g," ").trim();
  let m; if(!s)return NaN;
  if(m=s.match(/^(-?\d+) (\d+)\/(\d+)$/))return +m[1]+m[2]/m[3];
  if(m=s.match(/^(-?\d+)\/(\d+)$/))return m[1]/m[2];
  if(/^-?\d*\.?\d+$/.test(s))return +s;
  return NaN;
}
const calc=(a,o,b)=>o==="+"?a+b:o==="−"?a-b:o==="×"?a*b:o==="÷"?a/b:NaN;
function parseSpec(str){
  return String(str||"").split(",").map(t=>t.trim()).filter(Boolean).map(t=>{
    let m,w=0,n,d;
    if(m=t.match(/^(\d+)\s+(\d+)\/(\d+)$/)){w=+m[1];n=+m[2];d=+m[3]}
    else if(m=t.match(/^(\d+)\/(\d+)$/)){n=+m[1];d=+m[2];if(d&&n>=d){w=Math.floor(n/d);n=n%d}}
    else if(/^\d*\.?\d+$/.test(t))return{fixed:true,v:+t};
    else return{bad:t};
    if(!d)return{bad:t};
    if(n===0)return{fixed:true,v:w};
    const v=w+n/d;
    let r; if(!w){const f=n/d;r=f<.25?0:f<.75?.5:1}else r=n/d>=.5?w+1:w;
    return{n,d,w,v,r};
  });
}
const plain=x=>x.fixed?String(x.v):(x.w?x.w+" ":"")+x.n+"/"+x.d;
const rv=x=>x.fixed?x.v:x.r;
const BI={b:{n:"Round fractions to 0, ½, 1",std:"IN 5.CA.3"},m:{n:"Round mixed numbers",std:"IN 5.CA.3"},reas:{n:"Judge if an answer is reasonable",std:""}};
const skillOf=id=>{const s=(C.skills||[]).find(x=>x.id===id);return s?{n:s.name,std:s.std||""}:{n:"General",std:""}};
const REAS_OPTS=["Yes, it's close","No, it's too big","No, it's too small"];

/* prepare questions */
C.days.forEach(D=>D.ind.forEach(q=>{
  if(q.type!=="est")return;
  q._nums=parseSpec(q.nums).filter(x=>!x.bad);
  q._ans=null;
  if(q.op&&q._nums.length>1)q._ans=q._nums.slice(1).reduce((a,x)=>calc(a,q.op,rv(x)),rv(q._nums[0]));
  if(q.claim!==undefined&&q.claim!==""&&q._ans!=null){const c=+q.claim;
    q._reason=q.reasonAns||(c>q._ans*1.3?REAS_OPTS[1]:c<q._ans*.7?REAS_OPTS[2]:REAS_OPTS[0])}
}));

/* ---------- number line ---------- */
function makeLine(host,x,isDone,onRight,fbEl,onWrong){
  const bench=!x.w, marks=bench?[0,.5,1]:[x.w,x.w+1];
  const min=marks[0],max=marks[marks.length-1];
  const X=v=>40+(v-min)/(max-min)*260;
  let g=`<svg class="nl" viewBox="0 0 340 104" role="group" aria-label="Number line for ${plain(x)}"><line class="axis" x1="20" y1="56" x2="320" y2="56"/>`;
  if(x.d<=24)for(let k=1;k<x.d;k++){const px=X(min+k/x.d);g+=`<line class="tick" x1="${px}" y1="49" x2="${px}" y2="63"/>`}
  if(!bench)g+=`<line class="half" x1="${X(x.w+.5)}" y1="38" x2="${X(x.w+.5)}" y2="74"/><text class="halft" x="${X(x.w+.5)}" y="92">halfway</text>`;
  if(isDone){const px=X(x.v);g+=`<polygon class="pin" points="${px-8},24 ${px+8},24 ${px},38"/><text class="pint" x="${px}" y="16">${plain(x)}</text>`}
  marks.forEach(m=>{g+=`<g class="mk${isDone&&m===x.r?" good":""}" data-m="${m}" tabindex="${isDone?-1:0}" role="button" aria-label="${fmt(m)}"><circle cx="${X(m)}" cy="56" r="17"/><text x="${X(m)}" y="98">${fmt(m)}</text></g>`});
  host.innerHTML=g+`</svg>`;
  const half=x.d%2===0?String(x.d/2):`${Math.floor(x.d/2)}½`;
  if(isDone){if(fbEl){fbEl.className="fb yes";fbEl.textContent=`${plain(x)} ≈ ${fmt(x.r)}`}return}
  host.querySelectorAll(".mk").forEach(el=>{
    const act=()=>{const m=+el.dataset.m;
      if(Math.abs(m-x.r)<1e-9)onRight();
      else{el.classList.add("bad");onWrong&&onWrong(m);
        if(fbEl){fbEl.className="fb no";fbEl.textContent=bench
          ?`Not yet. Half of ${x.d} is ${half}. Is ${x.n} close to 0, close to ${half}, or close to ${x.d}?`
          :`Not yet. Look at ${x.n}/${x.d}. Half of ${x.d} is ${half}. Less than that stays at ${x.w}. That much or more goes up to ${x.w+1}.`}}};
    el.addEventListener("click",act);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}});
  });
}

/* ---------- shell ---------- */
document.title=`${C.room||""} WIN`.trim();
$("#hTitle").textContent=`${C.room?C.room+" ":""}WIN`;
$("#hSub").textContent=`${C.title||""}${C.title?". ":""}Tap the room your group is in.`;
let day=Math.min(store.get("day",0),C.days.length-1), room=null;
const nameEl=$("#stuName"); nameEl.value=store.get("name","");
nameEl.addEventListener("input",()=>store.set("name",nameEl.value));
C.subject=C.subject||"math";C.third=C.third||(C.subject==="ela"?"race":"ixl");C.tools=C.tools||{calc:false,mult:true,fracbars:true,numline:true,formulas:true};
const ELA=C.subject==="ela";
const ROOMS=[{id:"ind",nm:"Independent",icon:ELA?"📖":"✏️"},{id:"sg",nm:"Small group",icon:"👂"},C.third==="race"?{id:"race",nm:"RACE room",icon:"✍️"}:{id:"ixl",nm:"IXL room",icon:"💻"}];
const getS=i=>(store.get(`w${day}`,{}))[i]||{r:{},e:"",rs:"",wr:[],we:[],wx:[],wa:[],ok:0,done:false};
const saveS=(i,s)=>{const all=store.get(`w${day}`,{});all[i]=s;store.set(`w${day}`,all)};

function status(d,r){
  const D=C.days[d];
  if(r==="ind"){const s=store.get(`w${d}`,{});const n=Object.values(s).filter(x=>x&&x.done).length,t=D.ind.length;return t&&n===t?["All finished","done"]:n?[`${n} of ${t} finished`,""]:["Not started",""]}
  if(r==="sg")return store.get(`sg${d}done`,false)?["Finished","done"]:["Not started",""];
  if(r==="race"){const ck=raceChecks(D.race,store.get(`race${d}`,{}));const n=Object.values(ck).filter(Boolean).length;return n===4?["All 4 parts done","done"]:n?[`${n} of 4 parts`,""]:["Not started",""]}
  const need=Math.min(2,(D.ixl||[]).length);const k=store.get(`ixl${d}`,[]).filter(Boolean).length;return k>=need?["Skills done","done"]:[`${k} of ${need} skills`,""];
}
function renderDays(){
  $("#days").innerHTML=C.days.map((D,i)=>`<button aria-pressed="${i===day}" data-day="${i}">Day ${i+1}</button>`).join("");
  $("#days").querySelectorAll("button").forEach(b=>b.onclick=()=>{day=+b.dataset.day;store.set("day",day);room=null;render()});
}
function renderRoute(){
  $("#route").innerHTML=ROOMS.map(r=>{const[t,c]=status(day,r.id);return `<button class="stop ${r.id}" data-room="${r.id}" aria-current="${room===r.id}">
      <span class="dot" aria-hidden="true">${r.icon}</span><span><span class="nm">${r.nm}</span><br><span class="st ${c}">${c?"✓ ":""}${t}</span></span></button>`}).join("");
  $("#route").querySelectorAll(".stop").forEach(b=>b.onclick=()=>{room=b.dataset.room;render();$("#room").scrollIntoView({behavior:"smooth",block:"start"})});
}
function renderTurnBar(){
  $("#turnbar").className="turnbar";
  $("#turnbar").innerHTML=`<button class="turnbtn" aria-current="${room==="turn"}">📬 Done with WIN? Turn in my work</button>`;
  $("#turnbar").firstChild.onclick=()=>{room="turn";render();$("#room").scrollIntoView({behavior:"smooth",block:"start"})};
}
function render(){
  renderDays();renderRoute();renderTurnBar();
  const D=C.days[day],el=$("#room");
  if(!room){renderToolsBtn();el.innerHTML=`<div class="empty"><h2 class="fred" style="margin:0 0 .4rem">${fr(D.title)}</h2><p style="margin:0">${fr(D.target)}</p><p style="margin:.6rem 0 0">Tap your room above to start.</p></div>`;return}
  ({ind:renderInd,sg:renderSG,ixl:renderIXL,race:renderRACE,turn:renderTurn})[room](el,D);
  renderToolsBtn();
}

/* ---------- independent ---------- */
const openPads=new Set();
function workText(q,s){
  if(q.type==="mc"||q.type==="evidence")return (q.type==="evidence"?"Evidence: ":"Answer: ")+(q.options[s.val]?.text||"");
  if(q.type==="num")return "Answer: "+(s.val||"")+(q.unit?" "+q.unit:"");
  const parts=q._nums.filter(x=>!x.fixed).map(x=>`${plain(x)} ≈ ${fmt(x.r)}`);
  if(q.op&&s.e)parts.push(`${q._nums.map(x=>fmt(rv(x))).join(` ${q.op} `)} = ${s.e}${q.unit?" "+q.unit:""}`);
  if(q._reason&&s.rs)parts.push(s.rs);
  return parts.join("; ");
}

function mountPad(i){

const STOP=new Set("the a an and or but of to in on at for with is are was were be been this that these those it its from by as what how why does do did which who your you their there use evidence text story author".split(" "));
function raceChecks(prompt,r){r=r||{};const w=t=>String(t||"").toLowerCase().match(/[a-z']+/g)||[];
  const keys=[...new Set(w(prompt).filter(x=>x.length>3&&!STOP.has(x)))],R=w(r.R),E=w(r.E);

    cite:/["“”]/.test(r.C||"")&&w(r.C).length>=5,explain:E.length>=12&&/(because|shows|this means|proves|so |which|since|this is why)/i.test(r.E||"")}}
const STARTERS={R:["The question asks","In the text,"],A:["I think","The answer is","Yes, because","No, because"],C:["The text states, “","In paragraph __, the author writes, “","For example, “"],E:["This shows that","This proves","This means that","This is important because"]};
const RACE_TIPS={R:"Turn the question into a sentence. Use words from the question.",A:"Answer the question in your own words.",C:"Quote the text. Put the author's exact words in quotation marks.",E:"Tell how your quote proves your answer. Use at least 12 words."};

      <div class="starters">${STARTERS[l].map(t=>`<button data-st="${l}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      <textarea id="r${l}" data-r="${l}">${esc(r[l]||"")}</textarea></div></div>`).join("")}
    <div class="rcheck" id="rcheck" aria-live="polite"></div></section>`;
  hookPassage(el);refreshEvidence();
  const upd=()=>{const o=store.get(rk,{});const ck=raceChecks(D.race,o);
    $("#rcheck").innerHTML=`<b>RACE checklist</b>`+[["restate","Restated the question using its key words"],["answer","Answered the question"],["cite","Quoted the text in quotation marks"],["explain","Explained how the quote proves the answer (12+ words)"]].map(([k,t])=>`<div class="${ck[k]?"ok":""}">${ck[k]?"✅":"⬜"} ${t}</div>`).join("");renderRoute()};

function refreshEvidence(){const D=C.days[day],box=$("#evlist");if(!box)return;const hl=store.get(`hl${day}`,{});

const MG={
"6.NS.1":L=>{const n=ri(3,L>1?60:20);const c=pick([["A diver is {n} feet below sea level.",-1,"sea level"],["The temperature is {n} degrees below zero.",-1,"0 degrees"],["Jamal deposits ${n} into his bank account.",1,"no change in the account"],["A plane flies {n} feet above sea level.",1,"sea level"],["Ava owes her brother ${n}.",-1,"owing nothing"],["The team loses {n} yards on a play.",-1,"no gain or loss"],["An elevator rises {n} floors.",1,"no movement"]]);

"6.NS.1":["Positive and negative numbers describe opposite directions. 0 is the starting point.","Above, gaining, and depositing are [[positive]]. Below, losing, and owing are [[negative]]. 0 is the [[starting point|start]].","A diver is 15 feet below sea level. →?\nStep 1: Find the starting point: sea level is 0.\nStep 2: Below sea level is the negative direction.\nStep 3: The diver is at **−15**.","The temperature rose 8 degrees. Which number? [[8|+8]]","Give your own example of a negative number in real life. What does 0 mean in your example?"],

"6.NS.3":["On a number line, numbers get greater as you move right.","A number to the right is always [[greater|bigger|larger]]. Every negative number is [[less|smaller]] than every positive number.","Order: 3, −7, −2, 5\nStep 1: Negatives come first. −7 is farther left than −2.\nStep 2: Then 3, then 5.\nStep 3: **−7, −2, 3, 5**.","Which is greater, −3 or −8? [[−3|-3]]","Explain why −3 is greater than −8 even though 8 is bigger than 3."],
"6.NS.4":["Read the problem, decide the operation, then estimate to check your answer.","If the problem puts equal groups together, [[multiply]]. If it asks how many groups fit, [[divide]]. Always [[estimate]] first.","Each bag holds 3/4 pound. How much do 4 bags hold?\nStep 1: Equal groups, so multiply: 4 × 3/4.\nStep 2: 4 × 3 = 12, so 12/4.\nStep 3: 12/4 = **3 pounds**. Estimate: 4 bags of almost 1 pound is almost 4. ✓","Pens cost $1.25 each. How much do 4 pens cost? [[5|5.00|$5|$5.00]]","How did estimating help you check your answer?"],
"6.NS.5":["Order of operations: parentheses, exponents, multiply and divide left to right, add and subtract left to right.","Do [[parentheses]] first, then [[exponents]]. Multiply and divide from [[left]] to right.","4 + 3 × 2² = ?\nStep 1: Exponent first: 2² = 4.\nStep 2: Multiply: 3 × 4 = 12.\nStep 3: Add: 4 + 12 = **16**.","6 + 2 × 5 = [[16]]","Why do we all need to follow the same order of operations?"],
"6.NS.6":["The GCF is the greatest factor two numbers share. The LCM is the least multiple they share.","GCF uses [[factors]]. LCM uses [[multiples]].","Rewrite 24 + 36 with the GCF.\nStep 1: Factors of 24 and 36 in common: 1, 2, 3, 4, 6, 12.\nStep 2: The greatest is 12.\nStep 3: 24 + 36 = **12(2 + 3)**.","GCF of 18 and 27: [[9]]","When would you use the LCM in real life?"],
"6.NS.7":["Equivalent expressions are equal for every value of the variable.","The distributive property: 3(x + 2) = 3x + [[6]]. You can only combine [[like]] terms.","Simplify 4(x + 5) + 2x\nStep 1: Distribute: 4x + 20.\nStep 2: Add 2x: 4x + 2x = 6x.\nStep 3: **6x + 20**.","5(n + 3) = 5n + [[15]]","How can you check whether two expressions are equivalent?"],
"6.NS.8":["An exponent tells how many times to multiply the base by itself.","3² means 3 × [[3]]. (1/2)² means 1/2 × [[1/2]].","(2/3)² = ?\nStep 1: Multiply the fraction by itself: 2/3 × 2/3.\nStep 2: Numerators: 2 × 2 = 4. Denominators: 3 × 3 = 9.\nStep 3: **4/9**.","4² = [[16]]","Why is 3² not the same as 3 × 2?"],
"6.RP.1":["Fractions, decimals, and percents are three ways to write the same amount.","Percent means per [[hundred|100]]. To change a decimal to a percent, move the decimal [[two|2]] places right.","Write 3/5 as a percent.\nStep 1: Make the denominator 100: 3/5 = 60/100.\nStep 2: 60 per hundred is 60%.\nStep 3: **3/5 = 0.6 = 60%**.","1/4 = [[25]]%","Which form, fraction, decimal, or percent, is easiest for you? Why?"],
"6.RP.2":["A unit rate tells how much for exactly 1 unit.","To find a unit rate, [[divide]] the total by the number of units. Rate words include [[per]].","12 pencils cost $6. Cost per pencil?\nStep 1: Divide the cost by the number of pencils.\nStep 2: 6 ÷ 12 = 0.5.\nStep 3: **$0.50 per pencil**.","60 miles in 3 hours is [[20]] miles per hour.","Where do you see unit rates in real life?"],
"6.RP.3":["In a ratio table, you multiply or divide both quantities by the same number.","To keep a ratio equivalent, [[multiply]] both numbers by the same amount. Adding the same amount does [[not]] keep the ratio.","2 cups flour : 3 cups sugar. How much sugar for 8 cups flour?\nStep 1: 2 × 4 = 8, so the factor is 4.\nStep 2: 3 × 4 = 12.\nStep 3: **12 cups of sugar**.","3 : 5 = 9 : [[15]]","Why doesn't adding the same number to both parts keep a ratio equivalent?"],
"6.RP.4":["Use a tape diagram, table, or double number line to solve ratio problems.","In a tape diagram, all parts are [[equal]]. Percent is a ratio out of [[100|hundred]].","Boys to girls is 2:3. There are 25 students. How many girls?\nStep 1: Draw 5 equal parts (2 + 3).\nStep 2: 25 ÷ 5 = 5 students per part.\nStep 3: Girls = 3 parts = **15**.","25% of 80 = [[20]]","Which model helps you most for ratio problems? Why?"],

"6.AF.1":["A variable stands for a number. Evaluate by substituting and computing.","3n means 3 [[times|×]] n. \"5 more than\" means [[add]] 5.","Evaluate 4a + b when a = 3, b = 2.\nStep 1: Substitute: 4 × 3 + 2.\nStep 2: Multiply: 12 + 2.\nStep 3: **14**.","2x + 1 when x = 5: [[11]]","Write an expression for a real situation. What does your variable stand for?"],

"6.AF.4":["Inequalities show a range of values. Watch whether the number itself is included.","\"At least\" means [[≥|>=]]. \"No more than\" means [[≤|<=]].","You must be at least 48 inches tall to ride.\nStep 1: At least 48 means 48 or more.\nStep 2: 48 is included, so use ≥.\nStep 3: **h ≥ 48**.","\"Fewer than 10\" uses the symbol [[<]]","Give an example of a rule in your life that could be written as an inequality."],

maya:{type:"lit",title:"The Last Lap",text:`Maya had never run a full mile without stopping. Every afternoon, she watched the cross-country team loop around the track while she sat on the bleachers with her sketchbook.

"You could try out," Coach Rivera said one day, pausing beside her. Maya laughed and shook her head. "I'm not a runner," she said.

But that night, she laced up her old sneakers and jogged to the end of her street. Her lungs burned before she reached the corner. She walked home slowly, embarrassed, but the next night she went a little farther.

For three weeks, Maya added one mailbox at a time. Some nights it rained, and some nights her legs felt like concrete. She kept going anyway.

theo:{type:"lit",title:"The Bread Starter",text:`Theo's grandmother kept a jar of bubbling dough on her kitchen counter. She called it the starter, and she said it was older than Theo.

"You have to feed it every day," she told him the week she went to visit his aunt. "Flour and water. It's not hard, but you can't forget."

Theo forgot on the second day. By the third morning, the starter had sunk into a flat, sour puddle. He stared at it, his stomach twisting.

bees:{type:"info",title:"Why Honeybees Dance",text:`A honeybee that finds a good patch of flowers has a problem: how can it tell the rest of the hive where to go? Bees cannot draw maps or speak. Instead, they dance.

Scientists call it the waggle dance. The bee walks in a straight line while shaking its body, then circles back and repeats the move. The direction of the straight line shows the direction of the flowers compared to the sun.

The length of the waggle tells the distance. A longer waggle means the flowers are farther away. Other bees crowd around the dancer, feel its movements in the dark hive, and then fly off to find the food.

Karl von Frisch, an Austrian scientist, spent years studying this behavior. In 1973, he shared the Nobel Prize for his work. Before his research, many people did not believe insects could share such detailed information.

Today, scientists still study the waggle dance. Understanding how bees find food may help farmers protect these insects, which pollinate many of the crops people eat.`,

sleep:{type:"arg",title:"Later Start Times Would Help Students",text:`Many middle schools start before eight in the morning. I believe schools should start later so students can get the sleep they need.

The American Academy of Pediatrics recommends that middle and high schools start at 8:30 or later. Doctors say that preteens need about 9 to 12 hours of sleep each night, but many get far less.

When students are tired, they have a harder time paying attention and remembering what they learn. Some schools that moved their start times later reported better attendance.

Some people argue that later start times would make after-school sports end too late. However, schools could adjust practice schedules, and a rested athlete is a better athlete.

Besides, everyone knows that students are happier in the morning when they can sleep in. Starting later is simply the right thing to do.`,

const EL={
"6.RC.1":["Good readers find what the text says AND what it suggests, then prove it with evidence.","An inference is a smart guess based on [[evidence|clues]] and what you already know. You prove it by [[citing|quoting]] the text.","The story says: \"Her lungs burned before she reached the corner.\"\nStep 1: What does the text say? Her lungs burned quickly.\nStep 2: What do I know? Burning lungs mean you're out of breath.\nStep 3: Inference: **Maya is not used to running yet.**","\"He stared at it, his stomach twisting.\" Theo feels [[worried|guilty|nervous|upset]].","What is the difference between what a text says and what it suggests?"],
"6.RC.2":["A theme is a life lesson. Details in the story build it.","A theme is a message about [[life]], not just the topic. A summary should not include [[opinions|opinion]].","Topic: running. What does Maya learn?\nStep 1: What does the character want? To run a full mile.\nStep 2: What changes? She improves one mailbox at a time.\nStep 3: Theme: **Small, steady steps lead to growth.**","The topic is \"mistakes.\" A theme could be: Everyone makes mistakes, but it matters how you [[fix|respond|handle]] them.","How is a theme different from a topic?"],
"6.RC.3":["Every part of a story has a job: to introduce, build, turn, or resolve.","The [[turning point|climax]] is where things change. The [[resolution|ending]] is where the problem is solved.","Why does paragraph 4 of \"The Last Lap\" matter?\nStep 1: What happens? Maya practices for three weeks.\nStep 2: What does it lead to? Tryout day.\nStep 3: Job: **It builds toward the climax.**","A paragraph that introduces the characters is part of the [[exposition|beginning]].","Pick a paragraph. What would the story lose without it?"],
"6.RC.5":["The central idea is what the whole text is mostly about. Details support it.","A detail is [[smaller|narrower]] than the central idea. An objective summary leaves out [[opinions|opinion]].","\"Why Honeybees Dance\"\nStep 1: What is each paragraph about? Problem, direction, distance, research, why it matters.\nStep 2: What connects them all? The dance.\nStep 3: Central idea: **Bees use a dance to share where food is.**","\"Karl von Frisch won the Nobel Prize\" is a [[detail]].","How do you know if an idea is central or just a detail?"],
"6.RC.6":["Authors introduce an idea, then illustrate it with examples and elaborate with more detail.","Authors can introduce ideas with a [[question|problem]], an anecdote, or a fact. Examples [[illustrate|show]] the idea.","How does the bee text introduce the dance?\nStep 1: First sentence: a problem bees have.\nStep 2: Then: bees can't draw or speak.\nStep 3: **The author introduces the dance as the solution to a problem.**","An anecdote is a short [[story]].","Why might an author start with a question?"],
"6.RC.7":["Authors write to inform, persuade, or entertain. Their word choices show their perspective.","Words like \"I believe\" show the author's [[perspective|opinion]]. A text that explains how something works is written to [[inform|explain]].","\"Later Start Times Would Help Students\"\nStep 1: Look for clues: \"I believe schools should start later.\"\nStep 2: The author gives reasons and evidence.\nStep 3: **Purpose: to persuade.**","A story about a dragon is mostly written to [[entertain]].","How can you tell an author's perspective without being told directly?"],
"6.RC.8":["Strong claims are backed by reasons and evidence. Weak claims are not.","A supported claim has [[evidence|facts|a source]]. \"Everyone knows\" usually signals an [[unsupported|opinion]] claim.","Is \"Some schools reported better attendance\" supported?\nStep 1: Is there a fact or source? Yes, schools reported it.\nStep 2: Could we check it? Yes.\nStep 3: **Supported.**","\"Starting later is simply the right thing to do.\" This claim is [[unsupported|not supported]].","What makes evidence convincing?"],
"6.RC.10":["Use the words and sentences around an unknown word to figure out its meaning.","Context clues can be [[examples|definitions|synonyms]] or opposites. Always [[reread|check]] the sentence with your meaning.","\"a good patch of flowers\"\nStep 1: A patch OF flowers.\nStep 2: The bee found it somewhere outside.\nStep 3: **patch = a small area.**","\"Her legs felt like concrete\" means her legs felt [[heavy|tired]].","What do you do when context clues aren't enough?"],
"6.RC.11":["Knowing how two words are related helps you understand both.","A page is [[part]] of a book. An apple is a kind of [[fruit]].","wheel : bicycle\nStep 1: Is a wheel a part of a bicycle? Yes.\nStep 2: So the relationship is part/whole.\nStep 3: **branch : tree** matches.","spark : fire is a [[cause]]/effect relationship.","Make your own part/whole pair."],
"6.RC.12":["Words can mean almost the same thing but carry different feelings.","Connotation is the [[feeling]] a word gives. \"Thrifty\" is [[positive]]; \"cheap\" is negative.","curious vs. nosy\nStep 1: Both mean wanting to know things.\nStep 2: \"Nosy\" suggests being rude.\nStep 3: **curious = positive, nosy = negative.**","\"Confident\" is positive; \"[[arrogant]]\" is negative.","Why do authors choose words carefully?"],
"6.RC.13":["Greek and Latin roots are clues to word meaning.","\"port\" means [[carry]]. \"spect\" means [[look]].","\"spectator\"\nStep 1: Find the root: spect.\nStep 2: spect = look.\nStep 3: **A spectator is a person who watches.**","\"audible\": aud means [[hear]]","List three words with the same root."],
"6.W.6":["Clear sentences use the right pronouns and complete thoughts.","Use \"I\" as a [[subject]] and \"me\" as an object. A fragment is missing a complete [[thought|idea]].","Jamal and ___ went to the store.\nStep 1: Take out \"Jamal and.\"\nStep 2: \"I went\" sounds right; \"me went\" doesn't.\nStep 3: **Jamal and I went to the store.**","\"Because it rained.\" is a [[fragment]]","How can reading a sentence aloud help you find errors?"],
"6.W.7":["Punctuation helps readers understand how ideas connect.","A semicolon joins two complete [[sentences]]. A colon can introduce a [[list]].","The rain stopped ___ we went outside.\nStep 1: \"The rain stopped\" is complete.\nStep 2: \"we went outside\" is complete.\nStep 3: **Use a semicolon: The rain stopped; we went outside.**","Extra information needs commas on [[both]] sides.","When would you use a semicolon instead of a period?"]

Object.assign(ML,{
"g5-compare":["To compare fractions and decimals, think about where each one sits on a number line.","Numbers farther to the [[right]] are greater. Write decimals with the same number of [[places|digits]] before comparing.","Compare 0.5 and 0.47 →?\nStep 1: Write 0.5 as 0.50.\nStep 2: Compare hundredths: 50 hundredths and 47 hundredths.\nStep 3: **0.5 > 0.47**.","Which is greater, 2/3 or 2/5? [[2/3]]","Why isn't the decimal with more digits always greater?"],
"g5-fracdiv":["A fraction is also a division problem: the numerator divided by the denominator.","3/4 means 3 [[÷|divided by]] 4. When 3 pizzas are shared by 4 people, each gets [[3/4]] of a pizza.","4 friends share 3 sandwiches equally. How much does each get?\nStep 1: Sharing means divide: 3 ÷ 4.\nStep 2: 3 ÷ 4 is the fraction 3/4.\nStep 3: **Each friend gets 3/4 of a sandwich.**","5 ÷ 8 as a fraction: [[5/8]]","Draw a picture to show why 2 ÷ 3 = 2/3."],
"g5-place":["Each place is worth 10 times the place to its right.","Multiplying by 10 moves every digit one place to the [[left]]. Dividing by 10 moves every digit one place to the [[right]].","3.45 × 10 = ?\nStep 1: Each digit moves one place left.\nStep 2: The 3 ones become 3 tens.\nStep 3: **3.45 × 10 = 34.5**.","6.2 ÷ 10 = [[0.62]]","Why doesn't adding a zero to the end of 3.45 multiply it by 10?"],
"g5-round":["Rounding finds the nearest easier number at a place you choose.","Look at the digit to the [[right]] of the rounding place. 5 or more rounds [[up]].","Round 4.372 to the nearest tenth.\nStep 1: The tenths digit is 3.\nStep 2: The digit to its right is 7, which is 5 or more.\nStep 3: **4.372 ≈ 4.4**.","Round 8.649 to the nearest hundredth: [[8.65]]","Why doesn't rounding just mean cutting off digits?"],
"g5-percent":["Percent means \"out of 100.\"","45% means 45 out of [[100]]. 1/2 is the same as [[50]]%.","Write 3/5 as a percent.\nStep 1: Make the denominator 100: multiply by 20.\nStep 2: 3 × 20 = 60, so 60/100.\nStep 3: **3/5 = 60%**.","1/4 = [[25]]%","Where do you see percents outside of school?"],
"g5-divide":["Division splits a number into equal groups. The remainder is what's left over.","The remainder must be [[less|smaller]] than the divisor. Estimate the [[quotient]] first.","Divide 745 ÷ 23.\nStep 1: Estimate: 23 is about 25, and 750 ÷ 25 = 30.\nStep 2: 23 × 32 = 736, and 745 − 736 = 9.\nStep 3: **32 R 9**. 9 is less than 23. ✓","100 ÷ 12 = 8 R [[4]]","In a word problem, how do you decide what to do with the remainder?"],
"g5-decimal":["Decimal operations work like whole numbers. Place value tells where the decimal point goes.","When adding or subtracting, line up the [[decimal points]]. Always [[estimate]] to check.","2.5 + 1.38 = ?\nStep 1: Write 2.5 as 2.50.\nStep 2: Line up the points and add: 2.50 + 1.38.\nStep 3: **3.88**. Estimate: 3 + 1 = 4. ✓","0.4 × 0.2 = [[0.08]]","How does estimating help you place the decimal point?"],
"g5-fracadd":["To add or subtract fractions, the pieces must be the same size first.","Find a common [[denominator]]. Add or subtract only the [[numerators]].","1/2 + 1/3 = ?\nStep 1: A common denominator is 6.\nStep 2: 1/2 = 3/6 and 1/3 = 2/6.\nStep 3: **3/6 + 2/6 = 5/6**. Estimate: ½ + a bit less than ½ is a bit less than 1. ✓","1/4 + 1/2 = [[3/4]]","Why can't you add the denominators?"],
"g5-fracmul":["Multiplying by a fraction finds a part of a group.","2/3 × 3/4 means 2/3 [[of]] 3/4. Multiply the numerators and multiply the [[denominators]].","3 × 2/5 = ?\nStep 1: 3 groups of 2/5.\nStep 2: 3 × 2 = 6, so 6/5.\nStep 3: **6/5 = 1 1/5**.","1/2 × 1/3 = [[1/6]]","Why does multiplying by a fraction less than 1 give a smaller answer?"],
"g5-fracdivide":["Dividing asks how many groups fit, or how big each share is.","4 ÷ 1/3 asks how many [[thirds]] fit in 4. 1/3 ÷ 4 splits one third into [[4]] parts.","3 ÷ 1/4 = ?\nStep 1: How many fourths are in 1 whole? 4.\nStep 2: In 3 wholes: 3 × 4.\nStep 3: **12**.","2 ÷ 1/5 = [[10]]","Draw a model for 1/2 ÷ 3."],
"g5-multiply":["The standard algorithm multiplies by each place, then adds the partial products.","When multiplying by the tens digit, write a [[zero|0]] first. Then [[add]] the partial products.","46 × 23 = ?\nStep 1: 46 × 3 = 138.\nStep 2: 46 × 20 = 920.\nStep 3: **138 + 920 = 1,058**.","32 × 11 = [[352]]","Why do you write a zero before multiplying by the tens digit?"],
"g5-expr":["Parentheses show which step happens first.","In (4 + 5) × 2, you [[add]] first. Without parentheses, multiply before you [[add]].","Write: add 6 and 3, then multiply by 4.\nStep 1: Adding happens first, so it goes in parentheses: (6 + 3).\nStep 2: Then × 4.\nStep 3: **(6 + 3) × 4 = 36**.","(10 − 4) × 3 = [[18]]","How can parentheses change the value of an expression?"],
"g5-shapes":["Shapes belong to families. A shape can have more than one name.","Every square is a [[rectangle]] and a rhombus. A [[trapezoid]] has at least one pair of parallel sides.","Is every rectangle a parallelogram?\nStep 1: A parallelogram needs 2 pairs of parallel sides.\nStep 2: A rectangle has 2 pairs of parallel sides.\nStep 3: **Yes, every rectangle is a parallelogram.**","A triangle with a 90° angle is a [[right]] triangle.","Is every rhombus a square? Explain."],
"g5-coord":["An ordered pair tells how far to move over, then up.","In (3, 5), move 3 to the [[right]], then 5 [[up]].","Plot (4, 2).\nStep 1: Start at (0, 0).\nStep 2: Move 4 right along the x-axis.\nStep 3: **Move 2 up and mark the point.**","(0, 6) is on the [[y]]-axis.","Why does the order of the numbers in (2, 7) matter?"],
"g5-convert":["Converting changes the unit, not the amount.","Big unit to small unit: [[multiply]]. Small unit to big unit: [[divide]].","How many inches are in 4 feet?\nStep 1: 1 foot = 12 inches.\nStep 2: Feet to inches is big to small, so multiply.\nStep 3: **4 × 12 = 48 inches**.","3 meters = [[300]] centimeters","How can you check that your conversion makes sense?"],
"g5-volume":["Volume counts how many unit cubes fill a solid.","V = length × width × [[height]]. Volume is measured in [[cubic]] units.","A box is 4 cm × 3 cm × 2 cm.\nStep 1: One layer: 4 × 3 = 12 cubes.\nStep 2: There are 2 layers.\nStep 3: **12 × 2 = 24 cubic cm**.","5 × 2 × 3 = [[30]] cubic units","How is volume different from area?"],
"g5-area":["Area of a rectangle is length × width, even with fractions.","Area uses [[square]] units. To find it, [[multiply]] the side lengths.","A rectangle is 1/2 ft by 3/4 ft.\nStep 1: Area = 1/2 × 3/4.\nStep 2: Multiply: 3/8.\nStep 3: **3/8 square foot**.","2/3 × 1/2 = [[1/3|2/6]] square unit","Draw a model to show 1/2 × 1/3."],
"g5-lineplot":["A line plot shows how often each value happens. Each X is one data point.","Each X stands for [[one]] measurement. To find a total, [[add]] the values.","Line plot: 1/4, 1/4, 1/2, 3/4, 3/4, 3/4\nStep 1: Count the 3/4 marks: 3.\nStep 2: Total of those: 3 × 3/4.\nStep 3: **9/4 = 2 1/4**.","Three Xs at 1/2 total [[1 1/2|3/2]]","What question could you answer with a line plot of plant heights?"]
});

function generateUnit({grade,subject,codes,days,perDay,level,seed,title}){
  R=rng(seed||Date.now());grade=String(grade||gradeOf(codes[0])||"6");
  const famCode={};codes.forEach(c=>{famCode[genOf(c)]=famCode[genOf(c)]||c});
  const retag=(q,c)=>{if(q)q.skill=sid(c);return q};
  const skills=codes.map(c=>({id:sid(c),name:SHORT[c]||stdInfo(subject,c)[1],std:"IN "+c}));
  const plan=[];for(let d=0;d<days;d++){const per=Math.max(1,Math.ceil(codes.length/days));const s=codes.slice((d*per)%codes.length,(d*per)%codes.length+per);plan.push(s.length?s:[codes[d%codes.length]])}
  const unit={id:(title||"unit").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,30)+"-"+Math.random().toString(36).slice(2,7),
    title:title||`Grade ${grade} ${subject==="math"?"Math":"ELA"} WIN: ${codes.map(c=>SHORT[c]||c).slice(0,3).join(", ")}`,room:"",smart:80,grade,subject,third:subject==="ela"?"race":"ixl",
    tools:{calc:false,mult:true,fracbars:true,numline:true,formulas:true},turnInNote:"Then open today's WIN assignment in Canvas, paste, and submit.",skills,days:[]};
  plan.forEach((cs,d)=>{
    const short=cs.map(c=>c).join(" + ");
    const day={title:`Day ${d+1}: ${cs.map(c=>SHORT[c]||c).join(" and ")}`,target:"I can "+cs.map(c=>TGT[c]||lower(stdInfo(subject,c)[1])).join(", and I can ")+".",ind:[],sg:[],standards:cs.map(c=>`IN ${c}: ${stdInfo(subject,c)[1]}`),ixl:[],race:""};
    if(subject==="math"){
      let est=0;const seen=new Set();for(let i=0;i<perDay;i++){const c=cs[i%cs.length];let q;
        const gn=genOf(c);for(let t=0;t<8;t++){q=retag(EST_GEN[gn]&&est<2&&R()<.35?estItem(level):MG[gn](level),c);const key=q.type==="est"?q.nums:q.prompt.replace(/[\d.]+/g,"#").slice(0,40);if(!seen.has(key)||t===7){seen.add(key);break}}
        if(q.type==="est")est++;day.ind.push(q)}
      const L=ML[genOf(cs[0])];day.sg=lessonSteps(L);
      day.ixl=cs.map(c=>({t:`IXL skill plan: Indiana 2023, ${c}`,d:`In IXL, open the Indiana (2023) grade ${grade} skill plan and choose a skill under ${c}.`})).concat([{t:"IXL Math Arena",d:"Only after you reach your SmartScore goal."}]);
      day.race=`Explain how you solved problem ${ri(2,Math.max(2,perDay))}. How do you know your answer makes sense?`;
    } else {
      const fs_=cs.map(genOf);const pk=pickPassage(fs_,d);const P=PASS[pk];
      day.passage={title:P.title,text:P.text};
      R=rng((seed||1)+d*97);
      /* passage items are written for grade 6 codes; map each to this grade's matching standard */
      const gradeCode={};stdList(grade,"ela").forEach(([c])=>{const f=genOf(c);if(!gradeCode[f])gradeCode[f]=c});
      const codeFor=f=>famCode[f]||gradeCode[f]||(grade==="6"?f:null);
      const pool=[];fs_.forEach(f=>P.items.filter(x=>x[0]===f).forEach(x=>pool.push(x)));
      P.items.filter(x=>!fs_.includes(x[0])&&codeFor(x[0])).forEach(x=>pool.push(x));
      const qs=[];
      const seenE=new Set();cs.forEach(c=>{const f=genOf(c);if(!P.items.some(x=>x[0]===f)){for(let k=0;k<Math.ceil(perDay/cs.length);k++){let q=null;for(let t=0;t<10;t++){q=elaBank(f);if(!q||!seenE.has(q.prompt+q.options.find(o=>o.correct).text))break}if(q){seenE.add(q.prompt+q.options.find(o=>o.correct).text);qs.push(retag(q,c))}}}});
      pool.forEach(x=>{if(qs.length<perDay)qs.push(retag(itemFrom(x),codeFor(x[0])))});
      day.ind=qs.slice(0,perDay);
      day.ind.forEach(q=>{if(!skills.find(s=>s.id===q.skill)){const code=Object.keys(STD_BY).find(c=>sid(c)===q.skill)||q.skill;skills.push({id:q.skill,name:SHORT[code]||stdInfo("ela",code)[1],std:"IN "+code})}});
      const lk=fs_.find(f=>EL[f]);day.sg=lessonSteps(lk?EL[lk]:ELA_GENERIC);
      day.race=fs_.map(f=>RACE_FOR[f]).find(Boolean)||P.race;
    }
    unit.days.push(day);
  });
  return unit;
}
function lower(s){return s.charAt(0).toLowerCase()+s.slice(1).replace(/\.$/,"")}
function pickPassage(cs,d){const scores={};Object.keys(PASS).forEach(k=>scores[k]=0);cs.forEach(c=>{Object.keys(PASS).forEach(k=>{if(PASS[k].items.some(x=>x[0]===c))scores[k]+=10});(ELA_PASS_FOR[c]||[]).forEach((k,i)=>scores[k]+=3-i)});
  const best=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const top=best.filter(x=>x[1]===best[0][1]).map(x=>x[0]);return best[0][1]?top[d%top.length]:Object.keys(PASS)[d%4]}
function itemFrom(x){const[code,type,prompt,correct,wrongs,hint]=x;return type==="evidence"?EV(prompt,correct,wrongs,code,hint):MC(prompt,correct,wrongs,code,hint)}
function lessonSteps(L){const w=L[2].split("\n");return[
  {tag:"listen",title:"Today's big idea",text:L[0]},
  {tag:"fill",title:"Notes",text:L[1].replace(/\. /g,".\n")},
  {tag:"watch",title:"Watch me",text:w.join("\n")},
  {tag:"wedo",title:"Try it with me",text:L[3]},
  {tag:"jot",title:"Stop and jot",text:L[4]}]}

function importAI(json,subject,codes){
  let o;try{o=JSON.parse(String(json).replace(/^```(json)?|```$/gm,"").trim())}catch(e){throw new Error("That isn't valid JSON. Copy the AI's whole answer, starting with {.")}
  if(!o.days||!o.days.length)throw new Error("The JSON has no days.");
  const skills=codes.map(c=>({id:sid(c),name:SHORT[c]||stdInfo(subject,c)[1],std:"IN "+c}));
  const days=o.days.map((d,i)=>({title:d.title||`Day ${i+1}`,target:d.target||"",passage:d.passage&&d.passage.text?{title:d.passage.title||"",text:d.passage.text}:undefined,
    ind:(d.questions||[]).map(q=>{const std=q.standard&&codes.includes(q.standard)?q.standard:codes[0];
      if(q.type==="num")return{type:"num",prompt:q.prompt||"",answer:String(q.answer??""),alts:"",unit:q.unit||"",skill:sid(std),hint:q.hint||"",wrongs:(q.wrong||[]).map(w=>({ans:String(w.text),mis:w.misconception||""}))};
      return{type:q.type==="evidence"?"evidence":"mc",prompt:q.prompt||"",skill:sid(std),hint:q.hint||"",options:[{text:String(q.correct??""),correct:true},...(q.wrong||[]).map(w=>({text:String(w.text),correct:false,mis:w.misconception||""}))].sort(()=>Math.random()-.5)}}),
    sg:d.lesson?lessonSteps([d.lesson.bigIdea||"",d.lesson.notes||"",d.lesson.example||"",d.lesson.weDo||"",d.lesson.jot||""]):[],
    standards:codes.map(c=>`IN ${c}: ${stdInfo(subject,c)[1]}`),ixl:[],race:d.race||""}));
  return{skills,days};
}

function parseSpec(str){
  return String(str||"").split(",").map(t=>t.trim()).filter(Boolean).map(t=>{
    let m,w=0,n,d;
    if(m=t.match(/^(\d+)\s+(\d+)\/(\d+)$/)){w=+m[1];n=+m[2];d=+m[3]}
    else if(m=t.match(/^(\d+)\/(\d+)$/)){n=+m[1];d=+m[2];if(d&&n>=d){w=Math.floor(n/d);n=n%d}}
    else if(/^\d*\.?\d+$/.test(t))return{fixed:true,v:+t,t};
    else return{bad:t};
    if(!d)return{bad:t};
    if(n===0)return{fixed:true,v:w,t};
    const f=n/d;let r,tie=false;
    if(!w){r=f<.25?0:f<.75?.5:1;tie=Math.abs(f-.25)<1e-9||Math.abs(f-.75)<1e-9}else r=f>=.5?w+1:w;
    return{n,d,w,r,tie,t};
  });
}

  const nums=parseSpec(q.nums),bad=nums.filter(x=>x.bad),ok=nums.filter(x=>!x.bad),warn=[];
  if(!ok.length)warn.push("Type at least one number, like 7/8 or 3 1/4.");
  if(bad.length)warn.push(`Can't read: ${bad.map(x=>x.bad).join(", ")}. Use forms like 7/8, 3 1/4, or 20.`);
  if(ok.some(x=>x.tie))warn.push("1/4 and 3/4 sit exactly between two benchmarks. The portal rounds them up, but students may argue. Consider another fraction.");
  if(q.op&&ok.length<2)warn.push("An operation needs at least two numbers.");
  if(ok.length&&ok.every(x=>x.fixed))warn.push("Add a fraction or mixed number so there's something to round.");
  let ans=null;if(q.op&&ok.length>1)ans=ok.slice(1).reduce((a,x)=>calc(a,q.op,x.fixed?x.v:x.r),ok[0].fixed?ok[0].v:ok[0].r);
  if(ans!=null&&(!isFinite(ans)||ans<0))warn.push("The estimate comes out negative or undefined. Change the numbers.");
  let reason="";if(q.claim!==undefined&&q.claim!==""&&ans!=null){const c=+q.claim;reason=isNaN(c)?"":c>ans*1.3?"No, it's too big":c<ans*.7?"No, it's too small":"Yes, it's close"}
  return{ok,warn,ans,reason};
}

  } else if(q.type==="mc"||q.type==="evidence"){

function estLive(q){
  const e=estInfo(q);let h="";
  if(e.ok.length){
    const r=e.ok.filter(x=>!x.fixed).map(x=>`${x.t} rounds to ${fmt(x.r)}`).join(", ");
    h+=`<b>Students will see:</b> ${esc(r||"")}${e.ans!=null?`. Estimate: <b>${esc(fmt(e.ans))}</b>`:""}${e.reason?`. Claimed answer check: <b>${e.reason}</b>`:""}.`;
  }
  if(e.warn.length)h+=e.warn.map(w=>`<div class="warn">${esc(w)}</div>`).join("");
  return h||"Type numbers to see the rounding.";
}

    <p class="dir">${math?"Show your work in the space for each problem. ":"Read carefully. "}Circle the letter of the best answer${D.ind.some(q=>!q.options&&q.type!=="est")?", or write your answer on the line":""}.${est?" To estimate, round mixed numbers to the nearest whole number and fractions to 0, ½, or 1.":""}</p>
    ${D.ind.map(pQ).join("")}

function pThird(D,d){const race=U.third==="race",ixl=!race&&(D.ixl||[]).length;if(!ixl&&!D.race)return "";

  if(ixl)h+=`<h2>IXL</h2><p>Work on each skill in order. Stop when you reach a SmartScore of <b>${esc(U.smart||80)}</b>, then check it off.</p>
    <table class="grid"><tr><th class="c">Done</th><th>Skill</th><th class="c">My SmartScore</th></tr>${D.ixl.map(k=>`<tr><td class="c"><span class="box"></span></td><td><b>${esc(k.t)}</b>${k.d?`<br><span class="soft">${pfr(k.d)}</span>`:""}</td><td></td></tr>`).join("")}</table>`;
  if(D.race){const cite=U.subject==="ela"||D.passage?"Quote the text in quotation marks.":"Show your evidence: the numbers or steps you used.";
    h+=`<h2>RACE response</h2>${D.passage&&D.passage.text?`<p class="soft">Use the passage on your practice worksheet. Underline your evidence.</p>`:""}<div class="prompt">${pfr(D.race)}</div>

    <p class="check"><b>Check:</b> <span><span class="box"></span>Restated the question</span> <span><span class="box"></span>Answered it</span> <span><span class="box"></span>${U.subject==="ela"?"Quoted the text":"Showed my work"}</span> <span><span class="box"></span>Explained how my evidence proves it</span></p>`}

function pKey(D,d){
  return `${dayHead(D,d,"Answer key")}<table class="grid key"><tr><th class="c">#</th><th>Answer</th><th>Skill</th><th>If a student chose this, they may have...</th></tr>${D.ind.map((q,i)=>{let a="";const w=[];
    if(q.type==="est"){const e=estInfo(q);a=e.ok.filter(x=>!x.fixed).map(x=>`${pfr(x.t)} → ${pfr(fmt(x.r))}`).join("<br>")+(e.ans!=null?`<br>Estimate: <b>${pfr(fmt(e.ans))}</b> ${esc(q.unit||"")}`:"")+(e.reason?`<br>Reasonable? <b>${esc(e.reason)}</b>`:"")}
    else if(q.options)q.options.forEach((o,k)=>{if(o.correct)a=`<b>${LET[k]}</b>. ${pfr(o.text)}`;else if(o.mis)w.push(`<b>${LET[k]}</b>: ${esc(o.mis)}`)});

    ${(D.sg||[]).some(s=>/\[\[/.test(s.text||""))?`<p class="soft">Blanks on the small group notes page are filled in on the lesson plan.</p>`:""}`}
function pSheet(D,d){const by={};D.ind.forEach((q,i)=>(by[q.skill]=by[q.skill]||[]).push(i+1));const cols=Object.entries(by),N=D.ind.length;

    <tbody>${[...Array(rows)].map((_,r)=>`<tr><td>${esc(names[r]||"")}</td>${cols.map(([,ps])=>`<td class="c soft">/${ps.length}</td>`).join("")}<td class="c soft">/${N}</td><td></td><td class="c soft">R  P  X</td></tr>`).join("")}</tbody></table>
    <p class="legend"><b>R</b> Small group reteach: under ${lo} correct (60%), or confidence 1 to 2. <b>P</b> Independent practice: ${lo} to ${Math.max(lo,hi-1)} correct. <b>X</b> IXL and enrichment: ${hi} or more correct (85%) and confidence 3 to 4.</p>`}
